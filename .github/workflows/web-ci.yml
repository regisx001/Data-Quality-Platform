name: Web CI

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
  pull_request:
    branches: [master]
    paths:
      - 'web/**'

jobs:
  check-build:
    name: Check & build (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Build
        run: bun run build
