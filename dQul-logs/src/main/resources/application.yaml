spring:
  application:
    name: dQul-logs

  datasource:
    url: ${DQUL_LOGS_DATABASE_URL:jdbc:postgresql://localhost:3452/dqul_logs}
    username: ${DQUL_LOGS_DATABASE_USERNAME:postgres}
    password: ${DQUL_LOGS_DATABASE_PASSWORD:postgres}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: dqul-logs-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:7379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:5m}
      cache-null-values: false
      key-prefix: dqul-logs
      use-key-prefix: true

dqul:
  kafka:
    topics:
      logs-aggregate-request: ${KAFKA_TOPIC_LOGS_AGGREGATE_REQUEST:dqul.logs.aggregate.request}
      logs-aggregate-result: ${KAFKA_TOPIC_LOGS_AGGREGATE_RESULT:dqul.logs.aggregate.result}

server:
  port: 7001

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always