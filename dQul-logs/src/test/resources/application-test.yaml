# Test profile: in-memory H2 (PostgreSQL mode) + embedded Kafka, so the test suite
# runs fully standalone without Docker/Testcontainers.
spring:
  datasource:
    url: jdbc:h2:mem:dqul_logs;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # Redis is NOT required for the standalone test suite. Use the in-memory
  # ConcurrentMap cache backend so caching annotations work without a Redis server.
  cache:
    type: simple

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    # Provided by @EmbeddedKafka via the spring.embedded.kafka.brokers property
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: dqul-logs-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # JSON deserialization is configured programmatically in KafkaConfig
      # (uses the application ObjectMapper, ignores type headers, maps to LogIngestionDto)
