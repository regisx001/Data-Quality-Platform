spring:
  application:
    name: dQul

  datasource:
    url: ${DQUL_DATABASE_URL}
    username: ${DQUL_DATABASE_USERNAME}
    password: ${DQUL_DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_MAIN:dqul-main-group}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      missing-topics-fatal: false

dqul:
  logging:
    http:
      enabled: ${DQUL_HTTP_LOGGING_ENABLED:true}
      exclude-paths:
        - /health
        - /actuator
        - /swagger
        - /v3/api-docs
        - /api/v1/auth/me
        - .ico
        - .js
        - .css
  kafka:
    topics:
      platform-logs: ${KAFKA_TOPIC_PLATFORM_LOGS:platform-logs-topic}
      platform-logs-dlt: ${KAFKA_TOPIC_PLATFORM_LOGS_DLT:platform-logs-topic.DLT}
      profile-request: ${KAFKA_TOPIC_PROFILE_REQUEST:dqul.dataset.profile.request}
      profile-result: ${KAFKA_TOPIC_PROFILE_RESULT:dqul.dataset.profile.result}

security:
  jwt:
    key: ${JWT_SECRET_KEY}
    expiration-time: ${JWT_EXPIRATION_TIME}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:21001}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
  bucket: ${MINIO_BUCKET:dqul-bucket}

# Apache Spark Compute Engine Configuration
spark:
  enabled: ${SPARK_ENABLED:true}
  app-name: ${SPARK_APP_NAME:dQul-Data-Quality-Engine}
  master: ${SPARK_MASTER:local[*]}
  driver-host: ${SPARK_DRIVER_HOST:localhost}
  driver-bind-address: ${SPARK_DRIVER_BIND_ADDRESS:127.0.0.1}
  warehouse-directory: ${SPARK_WAREHOUSE_DIR:./spark-warehouse}
  driver-memory: ${SPARK_DRIVER_MEMORY:1g}
  executor-memory: ${SPARK_EXECUTOR_MEMORY:1g}
  executor-cores: ${SPARK_EXECUTOR_CORES:2}
  default-parallelism: ${SPARK_DEFAULT_PARALLELISM:4}
  shuffle-partitions: ${SPARK_SHUFFLE_PARTITIONS:8}
  log-level: ${SPARK_LOG_LEVEL:WARN}
  serializer: ${SPARK_SERIALIZER:org.apache.spark.serializer.JavaSerializer}
  ui:
    enabled: ${SPARK_UI_ENABLED:false}
    port: ${SPARK_UI_PORT:4040}
  sql:
    adaptive-enabled: ${SPARK_SQL_ADAPTIVE_ENABLED:true}
    ansi-enabled: ${SPARK_SQL_ANSI_ENABLED:true}
    case-sensitive: ${SPARK_SQL_CASE_SENSITIVE:false}
    session-timezone: ${SPARK_SQL_SESSION_TIMEZONE:UTC}
    broadcast-timeout: ${SPARK_SQL_BROADCAST_TIMEOUT:300}

server:
  port: 7000