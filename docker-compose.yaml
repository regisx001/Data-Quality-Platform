services:
  dqul-postgres:
    image: postgres:16
    container_name: dqul-postgres
    # restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dqul}

    ports:
      - "${POSTGRES_PORT:-3452}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dqul}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dqul-network
  minio:
    image: quay.io/minio/minio:latest
    container_name: dqul-minio
    # restart: unless-stopped

    ports:
      - "${MINIO_API_PORT:-21001}:9000"
      - "${MINIO_UI_PORT:-21002}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"
    networks:
      - dqul-network

volumes:
  postgres_data:
  minio_data:

networks:
  dqul-network:
    name: dqul-network
    driver: bridge
