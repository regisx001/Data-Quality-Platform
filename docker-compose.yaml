services:
  dqul-postgres:
    image: postgres:16
    container_name: dqul-postgres
    # restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dqul}

    ports:
      - "${POSTGRES_PORT:-3452}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dqul}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dqul-network
  minio:
    image: quay.io/minio/minio:latest
    container_name: dqul-minio
    # restart: unless-stopped

    ports:
      - "${MINIO_API_PORT:-21001}:9000"
      - "${MINIO_UI_PORT:-21002}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"
    networks:
      - dqul-network
  kafka:
    image: apache/kafka:3.8.0
    container_name: dqul-kafka
    # restart: unless-stopped

    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_HOST_PORT:-9093}:9093"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - dqul-network
  redis:
    image: redis:7.4-alpine
    container_name: dqul-redis
    # restart: unless-stopped

    ports:
      - "${REDIS_PORT:-7379}:6379"

    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dqul-network
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dqul-kafka-ui
    # restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "${KAFKA_UI_PORT:-24001}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Optional — read/write access to the logs DB if you want the UI's SQL console:
      # KAFKA_CLUSTERS_0_SCHEMAREGISTRY:
      # KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "true"

    networks:
      - dqul-network

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: dqul-spark:3.5.1-s3
    container_name: dqul-spark-master
    # restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_CLUSTER_UI_PORT:-8080}:8080"
    depends_on:
      - minio
    networks:
      - dqul-network

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: dqul-spark:3.5.1-s3
    container_name: dqul-spark-worker
    # restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - spark-master
      - minio
    networks:
      - dqul-network
