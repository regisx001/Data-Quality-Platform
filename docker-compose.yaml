services:
  dqul-postgres:
    image: postgres:16
    container_name: dqul-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dqul}

    ports:
      - "${POSTGRES_PORT:-3452}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dqul}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dqul-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  dqul-network:
    name: dqul-network
    driver: bridge
