spring:
  application:
    name: dQul-compute

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_COMPUTE:dqul-compute-group}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      missing-topics-fatal: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:7379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:5m}
      cache-null-values: false
      key-prefix: dqul-compute
      use-key-prefix: true

dqul:
  logs:
    datasource:
      url: ${DQUL_LOGS_DATABASE_URL:jdbc:postgresql://postgres:5432/dqul_logs}
      username: ${DQUL_LOGS_DATABASE_USERNAME:postgres}
      password: ${DQUL_LOGS_DATABASE_PASSWORD:postgres}
      driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}

  kafka:
    topics:
      profile-request: ${KAFKA_TOPIC_PROFILE_REQUEST:dqul.dataset.profile.request}
      profile-result: ${KAFKA_TOPIC_PROFILE_RESULT:dqul.dataset.profile.result}
      logs-aggregate-request: ${KAFKA_TOPIC_LOGS_AGGREGATE_REQUEST:dqul.logs.aggregate.request}
      logs-aggregate-result: ${KAFKA_TOPIC_LOGS_AGGREGATE_RESULT:dqul.logs.aggregate.result}

spark:
  enabled: ${SPARK_ENABLED:true}
  uiEnabled: ${SPARK_UI_ENABLED:false}
  master: ${SPARK_MASTER:spark://spark-master:7077}
  appName: ${SPARK_APP_NAME:dQul-compute-service}
  driverHost: ${SPARK_DRIVER_HOST:dqul-compute}
  driverBindAddress: ${SPARK_DRIVER_BIND_ADDRESS:0.0.0.0}
  driverMemory: ${SPARK_DRIVER_MEMORY:1g}
  executorMemory: ${SPARK_EXECUTOR_MEMORY:1g}
  executorCores: ${SPARK_EXECUTOR_CORES:2}
  defaultParallelism: ${SPARK_DEFAULT_PARALLELISM:4}
  shufflePartitions: ${SPARK_SHUFFLE_PARTITIONS:4}
  jarsPackages: ${SPARK_JARS_PACKAGES:org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.261}
  s3:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    accessKey: ${MINIO_ROOT_USER:minioadmin}
    secretKey: ${MINIO_ROOT_PASSWORD:minioadmin123}
    pathStyleAccess: true
    sslEnabled: false
    results-bucket: ${MINIO_BUCKET:dqul-results}

server:
  port: 7002

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always