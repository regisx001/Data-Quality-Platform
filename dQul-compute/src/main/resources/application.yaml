spring:
  application:
    name: dQul-compute

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: dqul-compute-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:5m}
      cache-null-values: false
      key-prefix: dqul-compute
      use-key-prefix: true

spark:
  enabled: ${SPARK_ENABLED:true}
  uiEnabled: ${SPARK_UI_ENABLED:false}
  master: ${SPARK_MASTER:spark://spark-master:7077}
  appName: ${SPARK_APP_NAME:dQul-compute-service}
  driverHost: ${SPARK_DRIVER_HOST:dqul-compute}
  driverBindAddress: ${SPARK_DRIVER_BIND_ADDRESS:0.0.0.0}
  driverMemory: ${SPARK_DRIVER_MEMORY:1g}
  executorMemory: ${SPARK_EXECUTOR_MEMORY:1g}
  executorCores: ${SPARK_EXECUTOR_CORES:2}
  defaultParallelism: ${SPARK_DEFAULT_PARALLELISM:4}
  shufflePartitions: ${SPARK_SHUFFLE_PARTITIONS:4}
  jarsPackages: ${SPARK_JARS_PACKAGES:org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.261}
  s3:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    accessKey: ${MINIO_ROOT_USER:minioadmin}
    secretKey: ${MINIO_ROOT_PASSWORD:minioadmin123}
    pathStyleAccess: true
    sslEnabled: false

server:
  port: 7002

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always